name: TypeScript SDK

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22", "24"]
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}

      # No lockfile is generated, so `npm ci` is not an option.
      # Scripts are skipped here so the build runs (and fails) in its own step.
      - name: Install dependencies
        run: npm install --no-audit --no-fund --ignore-scripts

      - name: Build (CJS + ESM)
        run: npm run build
